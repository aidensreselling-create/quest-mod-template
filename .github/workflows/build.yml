name: Build Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
uses: actions/checkout@v3

    
name: Set up ndk
    uses: android-actions/setup-android-ndk@v1
    with:
      ndk-version: r25c

    
name: Build Qmod
    run: |
      cd template
      ndk-build
      zip -r ../bat-cheat-mod.qmod ./libs/arm64-v8a/

    
name: Upload Artifact
    uses: actions/upload-artifact@v3
    with:
      name: qmod-artifact
      path: bat-cheat-mod.qmod
