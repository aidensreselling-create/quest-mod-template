name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nxtlvlsoftware/android-ndk-action@v1
        with:
          api: 24

      - name: Compile Code
        run: |
          # Use parallel builds (-j) for faster compilation
          find . -name "Android.mk" -execdir ndk-build -j$(nproc) \;

      - name: Package Qmod File
        run: |
          # Ensure file consistency by explicitly defining includes
          zip -r bat-cheat-mod.qmod . -i "*.so" "*.json" -x ".git/*" ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmod-artifact
          path: bat-cheat-mod.qmod
          retention-days: 7
